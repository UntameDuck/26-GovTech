name: CI

# 커밋 규칙에 있는 검사를 사람이 잊어도 CI 가 대신 막는다.
on:
  push:
    branches: [main, master]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
# 무료 러너 시간을 아끼고, 오래된 결과가 초록으로 남는 것을 막는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사 · lint · 빌드
    runs-on: ubuntu-latest

    # 어디에도 접속하지 않는 가짜 값이다.
    # npm ci 의 postinstall(prisma generate)과 next build 가 이 변수의
    # 존재만 확인하기 때문에 필요하다. 실제 DB 접속은 일어나지 않는다.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lockfile 대로만 설치한다. CI 에서 의존성이 달라지면
      # 로컬에서 통과한 것이 여기서 깨지고, 그 반대도 생긴다.
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 빌드는 DB 에 붙지 않는다. 모든 페이지가 동적이라 필요가 없다.
      # DATABASE_URL 은 형식만 맞으면 되므로 더미 값을 준다.
      - name: 빌드
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-only-not-a-real-secret
